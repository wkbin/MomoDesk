<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MomoDesk</title>
    <style>
      /* Applied before the module stylesheet loads so newly-created transparent
         windows never expose the canvas' default 300x150 overflow. */
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      #pet-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="pet-canvas" aria-label="MomoDesk desktop cat"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
